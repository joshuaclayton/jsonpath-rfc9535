[package]
name = "jsonpath-rfc9535"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "A complete RFC 9535 (JSONPath) query engine for serde_json values."
keywords = ["jsonpath", "rfc9535", "json", "query", "nom"]
categories = ["parser-implementations", "data-structures"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/joshuaclayton/jsonpath-rfc9535"
# Benchmarks, their fixtures, and the fuzz harness are dev-only; keep them out of the
# published .crate.
exclude = ["/benches", "/fuzz"]

[dependencies]
# `regex` feature only: SIMD substring search for metacharacter-free `search()`
# patterns, skipping the regex meta-engine's per-call overhead. Already in the tree
# transitively (the regex crate's own literal paths use it), so this adds no crates.
memchr = { version = "2.8", optional = true }
nom = "^8"
rayon = { version = "1.12", optional = true }
regex = { version = "1.12.4", optional = true }
# `scan` only. rsonpath-lib 0.10 is what pins this crate's rust-version at 1.89.
rsonpath-lib = { version = "0.10", optional = true }
rsonpath-syntax = { version = "0.4", optional = true }
serde_json = "1.0.150"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = "deny"
nursery = "deny"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
get_unwrap = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"
dbg_macro = "deny"
exit = "deny"
map_err_ignore = "deny"
indexing_slicing = "deny"
string_slice = "deny"
wildcard_enum_match_arm = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
partial_pub_fields = "deny"
unseparated_literal_suffix = "deny"
missing_assert_message = "deny"
redundant_else = "deny"

[features]
default = ["regex"]
# Enables the `match()` and `search()` function extensions, which require an
# I-Regexp (RFC 9485) engine backed by the `regex` crate. Without this feature a
# query that uses `match()`/`search()` is rejected by `JsonPath::parse`.
regex = ["dep:memchr", "dep:regex"]
# Parallelises `query_values` over large documents (arrays/frontiers of ≥2048
# elements) on the rayon global pool: 4–9× wall-clock on 100k-element documents at
# roughly 10× CPU. Small documents and the paths API (`query`) always take the
# serial path — normalized paths share `Rc` links, which are not `Send`. Named
# `rayon` per ecosystem convention (indexmap, hashbrown).
rayon = ["dep:rayon"]
# Hybrid byte-scanning evaluation over raw JSON text (`ScanQuery`): an rsonpath
# engine extracts a structural query prefix from the raw bytes and the residual
# (filters, tail segments) is evaluated per extracted fragment — no whole-document
# DOM. Experimental; off by default.
scan = ["dep:rsonpath-lib", "dep:rsonpath-syntax"]
# Gates the cross-library comparison bench (`benches/comparison.rs`). Pulls in `regex`
# so the `search()` case works even under `--no-default-features`, and `scan` for the
# hybrid rows. Not part of the published API; enable only to run
# `cargo bench --features compare`.
compare = ["regex", "scan"]

[dev-dependencies]
criterion = "0.8.2"
jsonpath-rust = "1.0.4"
jsonpath_lib = "0.3.0"
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json_path = "0.7.2"

[[bin]]
name = "jp"
path = "src/main.rs"

[[bench]]
name = "queries"
harness = false

[[bench]]
name = "comparison"
harness = false
required-features = ["compare"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
