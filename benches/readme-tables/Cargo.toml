[package]
name = "readme-tables"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate (not a workspace member, like /fuzz and ../backend-harness): it
# depends on every engine the README tables compare — including jsonpath_lib, which
# force-enables serde_json/preserve_order and therefore must never join the
# backend-harness graph. Every engine here measures the same (preserve_order)
# backend, matching the in-repo criterion comparison suite.

[dependencies]
jsonpath-rfc9535 = { path = "../.." }
jsonpath-rust = "1.0.4"
jsonpath_lib = "0.3.0"
serde_json = "1.0"
serde_json_path = "0.7.2"

[features]
# The `jsonpath-rfc9535 (rayon)` table column. Compile-time, so `just bench-readme`
# runs the harness twice: this build emits the parallel column (--rayon-only), the
# default build measures everything else and merges (--rayon <file>).
rayon = ["jsonpath-rfc9535/rayon"]

[profile.release]
debug = true
